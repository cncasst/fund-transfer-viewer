<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fund Transfer Status</title><style>
  :root{
    --navy:#1F3864;
    --accent:#2E5395;
    --accent-light:#D9E2F3;
    --yellow:#FFF2CC;
    --gray-bg:#F5F6F8;
    --gray-border:#D9DEE6;
    --text-muted:#6B7280;
    --white:#FFFFFF;

    --st-pending-fg:#8A6D00;      --st-pending-bg:#FFF3C4;
    --st-printed-fg:#B24E00;      --st-printed-bg:#FFE3C2;
    --st-forwarded-fg:#00695C;    --st-forwarded-bg:#CFEDE8;
    --st-completed-fg:#2E7D32;    --st-completed-bg:#D9F0DA;
    --st-cancelled-fg:#B00020;    --st-cancelled-bg:#F7D6DC;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--gray-bg);
    color:#1A1A1A;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:Verdana, Geneva, sans-serif;}

  a{color:inherit;text-decoration:none;}

  /* ---------- NAVBAR ---------- */
  .navbar{
    background:var(--navy);
    color:#fff;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:60px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .navbar .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:bold;font-size:17px;letter-spacing:.2px;
  }
  .navbar .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:#8FB3E8;
  }
  .navbar nav{display:flex;gap:4px;align-items:center;}
  .navbar nav a{
    padding:8px 14px;border-radius:6px;font-size:14px;font-weight:bold;
    color:#D7E2F2;
  }
  .navbar nav a.active, .navbar nav a:hover{background:rgba(255,255,255,.12); color:#fff;}
  .role-toggle{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    padding:5px 6px 5px 12px;border-radius:20px;
    font-size:12px;
  }
  .role-toggle button{
    border:none;background:#fff;color:var(--navy);
    font-weight:bold;font-size:12px;padding:5px 12px;border-radius:16px;cursor:pointer;
  }
  .role-toggle button.secondary{background:transparent;color:#D7E2F2;}
  .role-toggle .who{opacity:.85}

  /* ---------- LAYOUT ---------- */
  .page{max-width:1180px;margin:0 auto;padding:32px 24px 64px;}
  .hidden{display:none !important;}

  /* ---------- HOME / HERO ---------- */
  .hero{
    background:linear-gradient(135deg,var(--navy) 0%, var(--accent) 100%);
    color:#fff;
    padding:72px 24px 96px;
    text-align:center;
  }
  .hero h1{
    font-size:40px;margin:0 0 10px;letter-spacing:.5px;
  }
  .hero p{
    font-size:17px;color:#D7E2F2;margin:0 0 34px;
  }
  .search-card{
    max-width:680px;margin:0 auto;
    background:#fff;border-radius:12px;
    padding:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.18);
    display:flex;gap:10px;
  }
  .search-card input{
    flex:1;border:1px solid var(--gray-border);border-radius:8px;
    padding:14px 16px;font-size:15px;font-family:inherit;
    color:#1A1A1A;
  }
  .search-card input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-card button{
    background:var(--navy);color:#fff;border:none;border-radius:8px;
    padding:0 26px;font-weight:bold;font-size:14px;letter-spacing:.5px;
    cursor:pointer;
  }
  .search-card button:hover{background:var(--accent);}
  .search-hint{
    max-width:680px;margin:14px auto 0;color:#CBDAF0;font-size:12.5px;text-align:left;padding:0 4px;
  }

  .home-below{max-width:1000px;margin:-46px auto 0;padding:0 24px 60px;}
  .quicklinks{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  }
  .quicklink-card{
    background:#fff;border:1px solid var(--gray-border);border-radius:10px;
    padding:18px 20px;box-shadow:0 4px 16px rgba(16,30,54,.06);
  }
  .quicklink-card .k{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:bold;}
  .quicklink-card .v{font-size:15px;color:var(--navy);font-weight:bold;margin-top:6px;}

  /* ---------- SECTION HEADERS (Excel-style) ---------- */
  .section-title{
    background:var(--accent);color:#fff;font-weight:bold;font-size:13px;
    padding:10px 16px;border-radius:6px 6px 0 0;letter-spacing:.3px;
  }
  .section-body{
    background:#fff;border:1px solid var(--gray-border);border-top:none;
    border-radius:0 0 8px 8px;padding:20px;
    box-shadow:0 2px 10px rgba(16,30,54,.04);
  }
  .card-block{margin-bottom:26px;}

  h2.page-h{color:var(--navy);font-size:24px;margin:0 0 4px;}
  p.page-sub{color:var(--text-muted);font-size:14px;margin:0 0 24px;}

  /* ---------- STATUS PILL ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:bold;padding:5px 12px;border-radius:20px;
    white-space:nowrap;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .st-PENDING{color:var(--st-pending-fg);background:var(--st-pending-bg);}
  .st-PENDING .dot{background:var(--st-pending-fg);}
  .st-PRINTED{color:var(--st-printed-fg);background:var(--st-printed-bg);}
  .st-PRINTED .dot{background:var(--st-printed-fg);}
  .st-FORWARDED_TO_GEN_ACCTG{color:var(--st-forwarded-fg);background:var(--st-forwarded-bg);}
  .st-FORWARDED_TO_GEN_ACCTG .dot{background:var(--st-forwarded-fg);}
  .st-WAITING_FOR_CUSTOMERS_PAYMENT_CLEARANCE{color:#8A6D00;background:#FFF3C4;}
  .st-WAITING_FOR_CUSTOMERS_PAYMENT_CLEARANCE .dot{background:#8A6D00;}
  .st-FOR_ISSUANCE_OF_CHECK{color:#6A1B9A;background:#E9D7F5;}
  .st-FOR_ISSUANCE_OF_CHECK .dot{background:#6A1B9A;}
  .st-HISTORICAL{color:#666;background:#E8E8E8;}
  .st-HISTORICAL .dot{background:#666;}
  .st-COMPLETED{color:var(--st-completed-fg);background:var(--st-completed-bg);}
  .st-COMPLETED .dot{background:var(--st-completed-fg);}
  .st-CANCELLED{color:var(--st-cancelled-fg);background:var(--st-cancelled-bg);}
  .st-CANCELLED .dot{background:var(--st-cancelled-fg);}

  /* ---------- TABLES ---------- */
  table.grid{width:100%;border-collapse:collapse;font-size:13.5px;position:relative;}
  table.grid thead th{
    background:var(--navy);color:#fff;text-align:left;padding:10px 12px;
    font-size:12px;letter-spacing:.3px;position:sticky;top:0;z-index:2;
    cursor:pointer;user-select:none;
  }
  table.grid thead th:hover{background:var(--accent);}
  table.grid tbody td{
    padding:10px 12px;border-bottom:1px solid #EEF1F5;font-family:Verdana, sans-serif;font-size:12.5px;
  }
  table.grid tbody tr:hover{background:#F3F6FB;cursor:pointer;}
  table.grid tbody tr:nth-child(even){background:#FAFBFD;}
  table.grid tbody tr:nth-child(even):hover{background:#F3F6FB;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .results-meta{font-size:13px;color:var(--text-muted);margin-bottom:10px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-muted);
  }
  .empty-state .big{font-size:36px;margin-bottom:8px;}

  /* ---------- DETAIL PAGE ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:bold;font-size:13px;margin-bottom:18px;cursor:pointer;}
  .detail-top{
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;
    margin-bottom:22px;
  }
  .ft-id{font-size:13px;color:var(--text-muted);font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
  .ft-title{font-size:28px;color:var(--navy);font-weight:bold;margin:4px 0 0;}
  .summary-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px;
  }
  .summary-item{
    background:#fff;border:1px solid var(--gray-border);border-radius:8px;padding:14px 16px;
  }
  .summary-item .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:bold;letter-spacing:.4px;}
  .summary-item .v{font-size:17px;color:#1A1A1A;font-weight:bold;margin-top:4px;font-family:Verdana,sans-serif;}

  .status-banner{
    border-radius:10px;padding:20px 22px;margin-bottom:30px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .status-banner .left{display:flex;align-items:center;gap:14px;}
  .status-banner .circle{width:14px;height:14px;border-radius:50%;flex:none;}
  .status-banner .label{font-size:20px;font-weight:bold;}
  .status-banner .updated{font-size:13px;opacity:.85;}

  /* ---------- TIMELINE ---------- */
  .timeline{display:flex;justify-content:space-between;position:relative;margin:10px 0 6px;}
  .timeline::before{
    content:"";position:absolute;top:19px;left:6%;right:6%;height:3px;background:#E3E7EE;z-index:0;
  }
  .timeline .step{flex:1;text-align:center;position:relative;z-index:1;padding:0 6px;}
  .timeline .step .node{
    width:38px;height:38px;border-radius:50%;background:#E3E7EE;color:#9AA3B2;
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:bold;
    border:3px solid var(--gray-bg);font-size:16px;
  }
  .timeline .step.done .node{background:var(--st-completed-fg);color:#fff;}
  .timeline .step.current .node{background:var(--accent);color:#fff;}
  .timeline .step.current .title{color:var(--accent);font-weight:bold;}
  .timeline .step.cancelled .title{color:var(--st-cancelled-fg);font-weight:bold;}
  .timeline .step.cancelled .node{background:var(--st-cancelled-fg);color:#fff;}
  .timeline .step .title{font-size:12.5px;font-weight:bold;color:var(--navy);}
  .timeline .step .date{font-size:11.5px;color:var(--text-muted);margin-top:3px;font-family:Verdana,sans-serif;}
  .timeline .step:not(.done):not(.current):not(.cancelled) .title{color:#9AA3B2;}

  @media (max-width:720px){
    .timeline{flex-direction:column;gap:18px;}
    .timeline::before{display:none;}
    .timeline .step{display:flex;align-items:center;text-align:left;gap:14px;}
    .timeline .step .node{margin:0;flex:none;}
    .summary-grid{grid-template-columns:1fr;}
  }

  /* ---------- DASHBOARD KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:30px;}
  .kpi-card{
    background:#fff;border:1px solid var(--gray-border);border-radius:10px;
    padding:16px;text-align:center;
    box-shadow:0 2px 8px rgba(16,30,54,.04);
  }
  .kpi-card .val{font-size:28px;font-weight:bold;color:var(--navy);font-family:Verdana,sans-serif;}
  .kpi-card .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:bold;letter-spacing:.3px;margin-top:6px;}
  @media (max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

  /* ---------- ADMIN TOOLBAR ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input[type=text]{
    flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;font-size:13.5px;font-family:inherit;
  }
  .toolbar select{
    padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;
  }
  .btn{
    border:none;border-radius:6px;padding:10px 16px;font-weight:bold;font-size:13px;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--accent);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-outline:hover{background:var(--accent-light);}
  .btn-sm{padding:6px 12px;font-size:12px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,25,45,.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:#fff;border-radius:10px;max-width:480px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
  }
  .modal-header{background:var(--navy);color:#fff;padding:16px 20px;font-weight:bold;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
  .modal-header .close{cursor:pointer;font-size:18px;opacity:.8;}
  .modal-header .close:hover{opacity:1;}
  .modal-body{padding:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:bold;color:var(--navy);margin-bottom:6px;}
  .field select, .field input, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;
    font-family:Verdana,sans-serif;font-size:13px;background:var(--yellow);
  }
  .field textarea{min-height:70px;resize:vertical;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:10px;}
  .lock-note{
    font-size:12px;color:var(--text-muted);background:var(--gray-bg);border-radius:6px;padding:10px 12px;margin-top:4px;
  }

  .disclaimer{
    font-size:11.5px;color:var(--text-muted);text-align:center;padding:18px 24px 0;
  }

  footer.site-footer{
    text-align:center;color:var(--text-muted);font-size:12px;padding:26px 20px 40px;
  }

.result-row:hover{background:#F3F6FB;cursor:pointer;}
@media(max-width:720px){table.grid{min-width:900px;}.search-card{flex-direction:column;}.search-card button{height:44px;}}
#viewerLoginWrap{max-width:420px;margin:50px auto;}.msg{font-size:13px;margin-top:8px}.err{color:#b00020}
</style></head><body>
<div class="navbar"><div class="brand"><span class="dot"></span> FUND TRANSFER STATUS</div>
<nav><a href="#" class="active" id="homeNav">Home</a></nav><div class="role-toggle"><span class="who">Viewing as: Viewer</span></div></div>
<div class="page" id="viewerLoginWrap">
  <div class="section-title">VIEWER LOGIN</div>
  <div class="section-body">
    <div class="field">
      <label>Viewer Key</label>
      <input id="viewerKey" type="password" placeholder="Enter viewer key" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="viewerLoginBtn">SIGN IN</button>
    <div id="viewerLoginMsg" class="msg"></div>
  </div>
</div>
<div id="app" class="hidden"></div><footer class="site-footer">Internal Fund Transfer Monitoring</footer>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz0sxKdrhalq6WXyFpAu4KVgVnXpQdasbRq-UKJQvqe8jID54pdzmFT1qyLH8u-UUwV/exec';
let viewerKey = '';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safe(v) {
  return (v === null || v === undefined || String(v).trim() === '') ? '' : esc(v);
}
function peso(v) {
  if (v === null || v === undefined || String(v).trim() === '') return '';
  const n = Number(String(v).replace(/,/g,''));
  return Number.isFinite(n) ? n.toLocaleString('en-PH', {minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
}
function fmtDate(v) {
  if (v === null || v === undefined || String(v).trim() === '') return '';
  const d = new Date(String(v).length <= 10 ? String(v)+'T00:00:00' : v);
  return isNaN(d.getTime()) ? safe(v) : d.toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
}
function statusMeta(s) {
  const x = String(s||'').trim().toUpperCase();
  if (x === 'PRINTED') return ['PRINTED','Printed'];
  if (x.includes('FORWARD')) return ['FORWARDED_TO_GEN_ACCTG','Forwarded to Gen. Acctg'];
  if (x.includes("WAITING FOR CUSTOMER'S PAYMENT CLEARANCE") || x.includes('WAITING FOR CUSTOMERS PAYMENT CLEARANCE')) {
    return ['WAITING_FOR_CUSTOMERS_PAYMENT_CLEARANCE',"Waiting for customer's payment clearance"];
  }
  if (x.includes('FOR ISSUANCE OF CHECK') || x.includes('FOR ISSUANCE')) {
    return ['FOR_ISSUANCE_OF_CHECK','For issuance of check'];
  }
  if (x === 'COMPLETED') return ['COMPLETED','Completed'];
  if (x === 'CANCELLED') return ['CANCELLED','Cancelled'];
  if (x === 'HISTORICAL') return ['HISTORICAL','Historical'];
  if (x === 'PENDING' || x === 'FOR PROCESSING' || x === 'FOR PRINTING') return ['PENDING','Pending'];
  return ['PENDING', x || 'Pending'];
}
function pill(s) {
  const [cls,label] = statusMeta(s);
  return `<span class="pill st-${cls}"><span class="dot"></span>${esc(label.toUpperCase())}</span>`;
}
async function apiSearch(q) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=UTF-8'},
    body: JSON.stringify({action:'viewerSearch', viewerKey:viewerKey, q:q})
  });
  return await r.json();
}
function getField(r,names){
  for(const name of names){
    if(Object.prototype.hasOwnProperty.call(r,name) && r[name]!==null && r[name]!==undefined && String(r[name]).trim()!==''){
      return r[name];
    }
  }
  return '';
}
function getTransferNo(r){
  const candidates=['Transfer No.','Transfer No','Control No.','Control No','Fund Transfer No.','Fund Transfer No','FT No.','FT No'];
  const exact=getField(r,candidates);
  if(exact) return exact;
  const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const wanted=new Set(candidates.map(norm));
  const key=Object.keys(r||{}).find(k=>wanted.has(norm(k)) && r[k]!==null && r[k]!==undefined && String(r[k]).trim()!=='');
  return key ? r[key] : '';
}
function mapRecord(r) {
  return {
    raw:r,
    controlNo:getTransferNo(r),
    customer:getField(r,['Customer']),
    branch:getField(r,['Branch (check issued to)','Branch (Check Issued To)','Branch']),
    invoiceNo:getField(r,['Invoice No.','Invoice No','Invoice']),
    amount:getField(r,['Amount']),
    tmPartial:getField(r,['TM Partial Amount','TM partial amount']),
    amountIssued:getField(r,['Amount Issued','Amount issued']),
    status:getField(r,['Status','Current Status']),
    remittanceDate:getField(r,['Remittance Date','Payment / Remittance Date']),
    printedDate:getField(r,['Printed Date']),
    forwardedDate:getField(r,['Forwarded Date','Forwarded to General Accounting Date']),
    lastUpdated:getField(r,['Last Updated','Updated Date']),
    bank:getField(r,['Bank','Bank Name']),
    checkNo:getField(r,['Check No.','Check No','Check Number']),
    checkDate:getField(r,['Check Date']),
    preparedBy:getField(r,['Prepared By','Prepared by']),
    genAcctgStatus:getField(r,['Gen. Acctg. Status','Gen Acctg Status','Gen. Acctg Status']),
    cvBy:getField(r,['CV by','CV By','CVBY']),
    updatedBy:getField(r,['Updated By','Updated by']),
    remarks:getField(r,['Other Remarks','Remarks']),
    issuedCheckDate:getField(r,['Issued Check Date','Issued check date','Z']),
    issuedCheckNumber:getField(r,['Issued Check Number','Issued check number','Issued Check No.','Issued Check No','AA']),
    issuedBy:getField(r,['Issued By','Issued by','AB'])
  };
}
function renderHome() {
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <h1>FUND TRANSFER STATUS</h1>
      <p>Check the status of your Fund Transfer</p>
      <form class="search-card" id="searchForm">
        <input id="q" type="text" placeholder="Search by Fund Transfer No., Invoice No., Customer, or Check No." autofocus>
        <button type="submit">SEARCH</button>
      </form>
      <div class="search-hint">Partial invoice numbers work too.</div>
    </div>
  `;
  document.getElementById('homeNav').onclick = e => { e.preventDefault(); renderHome(); };
  document.getElementById('searchForm').onsubmit = e => {
    e.preventDefault(); search(document.getElementById('q').value.trim());
  };
}
async function search(q) {
  if (!q) return;
  const app = document.getElementById('app');
  app.innerHTML = `<div class="page"><div class="section-body">Searching…</div></div>`;
  try {
    const data = await apiSearch(q);
    if (!data.ok || !data.results || !data.results.length) {
      app.innerHTML = `<div class="page"><div class="empty-state"><div class="big">⌕</div>No matching Fund Transfer found.</div></div>`;
      return;
    }
    const rows = data.results.map(mapRecord);
    app.innerHTML = `
      <div class="page">
        <form class="search-card" id="resultsForm" style="max-width:100%;margin-bottom:22px;box-shadow:0 4px 16px rgba(16,30,54,.08);">
          <input id="resultsQ" value="${esc(q)}" placeholder="Search Fund Transfer No., Invoice No., Customer, or Check No.">
          <button type="submit">SEARCH</button>
        </form>
        <div class="results-meta">${rows.length} result${rows.length===1?'':'s'} for "<strong>${esc(q)}</strong>"</div>
        <div class="section-body" style="padding:0;overflow:auto;border-radius:8px;">
          <table class="grid"><thead><tr>
            <th>Transfer No.</th><th>Customer</th><th>Branch (check issued to)</th>
            <th>Amount Issued</th><th>Invoice No.</th><th>Status</th>
          </tr></thead><tbody>
          ${rows.map(r=>`<tr data-ctrl="${esc(r.controlNo)}" class="result-row">
            <td class="mono">${safe(r.controlNo)}</td>
            <td>${safe(r.customer)}</td>
            <td>${safe(r.branch)}</td>
            <td class="num mono">${peso(r.amountIssued)}</td>
            <td class="mono">${safe(r.invoiceNo)}</td>
            <td>${pill(r.status)}</td>
          </tr>`).join('')}
          </tbody></table>
        </div>
      </div>`;
    document.getElementById('resultsForm').onsubmit = e => { e.preventDefault(); search(document.getElementById('resultsQ').value.trim()); };
    document.querySelectorAll('.result-row').forEach((el, i) => {
      el.onclick = () => detail(rows[i]);
    });
  } catch(e) {
    app.innerHTML = `<div class="page"><div class="empty-state">Unable to reach the Fund Transfer server.</div></div>`;
  }
}
async function detail(record) {
  const r = record;
  if (!r) return;
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="back-link" id="back">← Back to search</div>
      <div class="detail-top">
        <div><div class="ft-id">Fund Transfer</div><div class="ft-title">${safe(r.controlNo)}</div></div>
        <div>${pill(r.status)}</div>
      </div>
      <div class="summary-grid">
        <div class="summary-item"><div class="k">Customer</div><div class="v">${safe(r.customer)}</div></div>
        <div class="summary-item"><div class="k">Branch (check issued to)</div><div class="v">${safe(r.branch)}</div></div>
        <div class="summary-item"><div class="k">Invoice No.</div><div class="v mono">${safe(r.invoiceNo)}</div></div>
        <div class="summary-item"><div class="k">Amount</div><div class="v">${peso(r.amount)}</div></div>
        <div class="summary-item"><div class="k">TM Partial Amount</div><div class="v">${peso(r.tmPartial) || '0.00'}</div></div>
        <div class="summary-item"><div class="k">Amount Issued</div><div class="v">${peso(r.amountIssued)}</div></div>
      </div>
      <div class="card-block">
        <div class="section-title">FUND TRANSFER DETAILS</div>
        <div class="section-body">
          <div class="summary-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="summary-item"><div class="k">Bank</div><div class="v">${safe(r.bank)}</div></div>
            <div class="summary-item"><div class="k">Check No.</div><div class="v">${safe(r.checkNo)}</div></div>
            <div class="summary-item"><div class="k">Check Date</div><div class="v">${fmtDate(r.checkDate)}</div></div>
            <div class="summary-item"><div class="k">Printed Date</div><div class="v">${fmtDate(r.printedDate)}</div></div>
            <div class="summary-item"><div class="k">Forwarded Date</div><div class="v">${fmtDate(r.forwardedDate)}</div></div>
            <div class="summary-item"><div class="k">Gen Acctg Status</div><div class="v">${safe(r.genAcctgStatus)}</div></div>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="section-title">CHECK ISSUANCE DETAILS</div>
        <div class="section-body">
          <div class="summary-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="summary-item"><div class="k">Issued Check Date</div><div class="v">${fmtDate(r.issuedCheckDate)}</div></div>
            <div class="summary-item"><div class="k">Issued Check Number</div><div class="v">${safe(r.issuedCheckNumber)}</div></div>
            <div class="summary-item"><div class="k">Issued By</div><div class="v">${safe(r.issuedBy)}</div></div>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="section-title">STATUS TIMELINE</div>
        <div class="section-body">
          <div class="timeline">
            ${(() => {
              const status = String(r.status || '').trim().toUpperCase();
              const genStatus = String(r.genAcctgStatus || '').trim().toUpperCase();
              const isCancelled = status === 'CANCELLED';

              // Four stages requested for the Viewer:
              // 1) Printed
              // 2) Forwarded by Gen Acctg
              // 3) For Issuance of Check
              // 4) Completed
              let currentIdx = -1;
              if (r.printedDate || status === 'PRINTED') currentIdx = 0;
              if (r.forwardedDate || status.includes('FORWARD') || genStatus.includes('FORWARD')) currentIdx = 1;
              if (
                genStatus.includes('ISSU') ||
                status.includes('ISSU') ||
                status.includes('FOR ISSUANCE')
              ) currentIdx = 2;
              if (status === 'COMPLETED') currentIdx = 3;

              const steps = [
                ['Printed', r.printedDate],
                ['Forwarded by Gen Acctg', r.forwardedDate],
                ['For Issuance of Check', ''],
                ['Completed', status === 'COMPLETED' ? (r.lastUpdated || r.forwardedDate) : '']
              ];

              return steps.map((step, i) => {
                let cls = '';
                let icon = String(i + 1);
                let date = '';

                if (isCancelled) {
                  if (i === 0) { cls = 'cancelled'; icon = '✕'; date = step[1] || ''; }
                } else if (i < currentIdx) {
                  cls = 'done'; icon = '✓'; date = step[1] || '';
                } else if (i === currentIdx) {
                  cls = 'current'; icon = '✓'; date = step[1] || '';
                }

                return `<div class="step ${cls}">
                  <div class="node">${icon}</div>
                  <div class="title">${step[0]}</div>
                  <div class="date">${date ? fmtDate(date) : (cls === 'current' ? 'In Progress' : 'Pending')}</div>
                </div>`;
              }).join('');
            })()}
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('back').onclick = () => renderHome();
}
document.getElementById('viewerLoginBtn').onclick = async () => {
  const key = document.getElementById('viewerKey').value.trim();
  const msg = document.getElementById('viewerLoginMsg');
  msg.textContent = 'Checking…';

  if (!key) {
    msg.innerHTML = '<span class="err">Please enter the Viewer Key.</span>';
    return;
  }

  viewerKey = key;
  try {
    const data = await apiSearch('');
    if (data && data.ok) {
      document.getElementById('viewerLoginWrap').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      renderHome();
    } else {
      viewerKey = '';
      msg.innerHTML = '<span class="err">Incorrect Viewer Key.</span>';
    }
  } catch (e) {
    viewerKey = '';
    msg.innerHTML = '<span class="err">Could not reach server.</span>';
  }
};

document.getElementById('viewerKey').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('viewerLoginBtn').click();
};
</script></body></html>
